[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vies-check"
version = "0.1.0"
description = "Check EU VAT numbers in VIES from async Python: valid, invalid or unavailable."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "getpylaunch", email = "hello@getpylaunch.com" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
keywords = ["vat", "vies", "eu", "vat-number", "validation", "asyncio", "httpx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/getpylaunch/vies-check"
Issues = "https://github.com/getpylaunch/vies-check/issues"
Changelog = "https://github.com/getpylaunch/vies-check/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/vies_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
